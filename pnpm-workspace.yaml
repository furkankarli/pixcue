packages:
  - apps/*
  - packages/*

# Always allow the newest releases (pnpm delays brand-new versions by default).
minimumReleaseAge: 0

# Dependencies allowed (true) or denied (false) to run install scripts.
allowBuilds:
  esbuild: true
  # Git hooks are installed by the root "prepare" script instead.
  lefthook: false
  workerd: true
