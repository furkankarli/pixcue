# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR per
# ecosystem; major bumps get their own PR so they can be reviewed separately.
# Commit messages follow the repo's Conventional Commits rules.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    open-pull-requests-limit: 10
    ignore:
      # @types/node follows the Node.js major in .nvmrc, not the latest Node.
      # Bump both together, by hand, when the project moves to a new LTS.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels: [dependencies]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
